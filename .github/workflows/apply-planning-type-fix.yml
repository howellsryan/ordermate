name: Apply planning type fix

on:
  push:
    branches:
      - rebuild/cloudflare-saas

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename v2 replenishment helper
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/worker/tenant-store-planning.ts")
          text = path.read_text()
          replacements = {
              "return Response.json(this.replenishmentSuggestions());": "return Response.json(this.planningReplenishmentSuggestions());",
              "private replenishmentSuggestions() {": "private planningReplenishmentSuggestions() {",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one occurrence of {old!r}, found {text.count(old)}")
              text = text.replace(old, new)
          path.write_text(text)
      - run: git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker/tenant-store-planning.ts
          git commit -m "fix: isolate v2 replenishment helper"
          git push origin HEAD:rebuild/cloudflare-saas
