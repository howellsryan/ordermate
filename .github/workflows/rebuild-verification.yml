# Automatic verification runs in Cloudflare Workers Builds.
# Keep this workflow for explicitly requested fallback runs only.
# See docs/cloudflare-ci.md.
name: Rebuild verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Operating Layer brand sweep
        run: node scripts/rebrand-operating-layer.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Test full suite
        run: npm test

      - name: Validate guest demo workflows explicitly
        run: npx vitest run test/demo-guest-acceptance.test.ts

      - name: Build production configuration
        run: npm run build

      - name: Build staging configuration
        run: npm run build:staging
