name: Apply fetch boundary fix

on:
  push:
    branches:
      - rebuild/cloudflare-saas

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Await tenant route handlers inside the fetch error boundary
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/worker/tenant-store.ts")
          text = path.read_text()
          start = text.index("  async fetch(request: Request): Promise<Response> {")
          end = text.index("\n  private dashboard()", start)
          before = text[start:end]
          after = before.replace("return this.", "return await this.")
          if before == after:
              raise SystemExit("No tenant fetch dispatch returns were updated")
          if "return this." in after:
              raise SystemExit("An un-awaited tenant fetch dispatch remains")
          path.write_text(text[:start] + after + text[end:])
      - run: git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker/tenant-store.ts
          git commit -m "fix: contain async tenant route errors"
          git push origin HEAD:rebuild/cloudflare-saas
