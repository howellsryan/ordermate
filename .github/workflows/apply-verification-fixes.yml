name: Apply verification fixes

on:
  push:
    branches:
      - rebuild/cloudflare-saas

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified type-hardening fixes
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              expected = count if count is not None else 1
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {actual}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          # Client response/navigation typing.
          model = Path("src/client/model.ts")
          text = model.read_text()
          marker = "export type WorkspacePage ="
          if marker in text:
              raise SystemExit("src/client/model.ts already contains workspace navigation types")
          text += '''\nexport type WorkspacePage =\n  | "overview"\n  | "orders"\n  | "warehouse"\n  | "wave-pick"\n  | "stocktake"\n  | "products"\n  | "inventory"\n  | "purchasing"\n  | "suppliers"\n  | "customers"\n  | "reports"\n  | "activity"\n  | "team"\n  | "settings";\n\nexport type SearchResult = {\n  id: string;\n  type: string;\n  title: string;\n  subtitle: string;\n  page: WorkspacePage;\n  badge?: string;\n};\n\nexport type AttentionResponse = {\n  total: number;\n  items: Array<{\n    id: string;\n    severity: "critical" | "warning" | "info";\n    type: string;\n    title: string;\n    detail: string;\n    page: WorkspacePage;\n  }>;\n};\n'''
          model.write_text(text)

          replace(
              "src/client/DocumentInbox.tsx",
              'import { controlApi, date } from "./api";',
              'import { controlApi, date, errorFrom } from "./api";',
          )
          replace(
              "src/client/DocumentInbox.tsx",
              '''      if (!response.ok) {\n        const payload = await response.json().catch(() => ({ error: response.statusText }));\n        throw new Error(payload.error || `Preview failed (${response.status})`);\n      }''',
              '''      if (!response.ok) throw await errorFrom(response);''',
          )
          replace(
              "src/client/DocumentInbox.tsx",
              '{previewError && <ErrorText error={previewError} />}',
              '{previewError !== null && <ErrorText error={previewError} />}',
          )

          # Normalize invalid optional import data to the declared nullable wire shape.
          replace(
              "src/worker/catalogue-import-plan.ts",
              '          leadTimeDays: parseWhole(row.leadTimeDays),',
              '          leadTimeDays: parseWhole(row.leadTimeDays) ?? null,',
          )

          # Keep typed error handling after Response.json() became unknown by default.
          replace(
              "src/worker/operations.ts",
              '    const payload = await response.json<{ error?: string }>().catch(() => ({}));',
              '    const payload = await response.json<{ error?: string }>().catch((): { error?: string } => ({}));',
          )
          replace(
              "src/worker/delivery-documents.ts",
              '      const error = await discrepancyResponse.json<{ error?: string }>().catch(() => ({}));',
              '      const error = await discrepancyResponse.json<{ error?: string }>().catch((): { error?: string } => ({}));',
          )

          # Queue processors use the same final TenantStore class exported by the Worker.
          replace(
              "src/worker/document-extraction.ts",
              'import type { TenantStore } from "./tenant-store-runtime";',
              'import type { TenantStore } from "./tenant-store-order-planning";',
          )
          replace(
              "src/worker/delivery-note-extraction.ts",
              'import type { TenantStore } from "./tenant-store-runtime";',
              'import type { TenantStore } from "./tenant-store-order-planning";',
          )

          # Layer-specific private helpers must not collide nominally with private helpers on base classes.
          replace("src/worker/tenant-store-discrepancies.ts", "private actor(request: Request)", "private discrepancyActor(request: Request)")
          replace("src/worker/tenant-store-discrepancies.ts", "this.actor(request)", "this.discrepancyActor(request)", count=3)
          replace("src/worker/tenant-store-discrepancies.ts", "private audit(request: Request", "private auditDiscrepancy(request: Request")
          replace("src/worker/tenant-store-discrepancies.ts", "this.audit(request", "this.auditDiscrepancy(request", count=2)

          replace("src/worker/tenant-store-imports.ts", "private actor(request: Request)", "private importActor(request: Request)")
          replace("src/worker/tenant-store-imports.ts", "this.actor(request)", "this.importActor(request)")

          replace("src/worker/tenant-store-planning.ts", "private actor(request: Request)", "private planningActor(request: Request)")
          replace("src/worker/tenant-store-planning.ts", "this.actor(request)", "this.planningActor(request)", count=2)
          replace("src/worker/tenant-store-planning.ts", "private audit(request: Request", "private auditPlanning(request: Request")
          replace("src/worker/tenant-store-planning.ts", "this.audit(request", "this.auditPlanning(request", count=2)

          # Preserve fail-closed domain guards while enabling TS control-flow narrowing in transaction callbacks.
          replace(
              "src/worker/tenant-store.ts",
              'const fail = (message: string, status = 400): never => { throw new DomainError(message, status); };',
              'function fail(message: string, status = 400): never { throw new DomainError(message, status); }',
          )

          # Barcode library 0.23 requires Node 24+; make the repository contract explicit.
          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          package["engines"] = {"node": ">=24"}
          package_path.write_text(json.dumps(package, indent=2) + "\n")

      - name: Validate patch shape
        run: git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package.json
          git commit -m "fix: harden rebuild verification failures"
          git push origin HEAD:rebuild/cloudflare-saas
